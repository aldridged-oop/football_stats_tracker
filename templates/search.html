<html>
<head>
    <link rel="stylesheet" href="static/style.css">
</head>

<body id="search">
<button class="home" onclick="location.replace('/')">home</button> <button class="player" onclick="location.replace('players.html')">players</button> <button class="search"  onclick="location.replace('search.html')" disabled>search</button>


<form action="search.html" method="post">
    <label for="player_name">Player name:</label>
    <input type="text" id="player_name" name="player_name" value="{{search_name}}">
    <button type="submit">Search</button>
</form>

{% if not search_name %}
<h2>Enter a player name to search.</h2>
{% elif results %}
<table>
    <tr>
        <th>Player name</th>
    </tr>
    {% for player in results %}
    <tr>
        <td>{{player[0]}}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<h2>No player found with that name.</h2>
{% endif %}

</body>
</html>
